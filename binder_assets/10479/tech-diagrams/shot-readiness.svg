<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">发射就绪判定</title>
  <desc id="description">解算持续运行；达到放行条件后 feeder 与 Indexer 才供料</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52ad32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18321a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f5f8f3"/>
  <rect x="54" y="46" width="1092" height="628" rx="28" fill="#ffffff" stroke="#bfd4b7" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="112" text-anchor="start" font-size="34" font-weight="700" fill="#102018"><tspan x="92" dy="0">发射就绪判定</tspan></text>
  <text x="92" y="150" text-anchor="start" font-size="18" font-weight="500" fill="#58665e"><tspan x="92" dy="0">解算持续运行；达到放行条件后 feeder 与 Indexer 才供料</tspan></text>
  <path d="M92 178 H1108" stroke="#bfd4b7" stroke-width="2"/>
  
  <g><rect x="92" y="224" width="300" height="110" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="242" y="269" text-anchor="middle" font-size="22" font-weight="600" fill="#102018"><tspan x="242" dy="0">驾驶员持续按下</tspan><tspan x="242" dy="28">射击指令</tspan></text></g>
  <g><rect x="450" y="224" width="300" height="110" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="600" y="269" text-anchor="middle" font-size="22" font-weight="600" fill="#102018"><tspan x="600" dy="0">至少一侧飞轮</tspan><tspan x="600" dy="28">达到目标速度</tspan></text></g>
  <g><rect x="808" y="224" width="300" height="110" rx="18" fill="#f5f8f3" stroke="#bfd4b7" stroke-width="2"/><text x="958" y="269" text-anchor="middle" font-size="22" font-weight="600" fill="#102018"><tspan x="958" dy="0">Hood 与炮塔</tspan><tspan x="958" dy="28">持续跟踪并记录状态</tspan></text></g>
  <path d="M 242 334 L 478 448" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 600 334 L 600 430" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g><rect x="410" y="430" width="380" height="124" rx="18" fill="#e7f3e2" stroke="#52ad32" stroke-width="2"/><text x="600" y="482" text-anchor="middle" font-size="24" font-weight="600" fill="#102018"><tspan x="600" dy="0">FIRE ALLOWED</tspan><tspan x="600" dy="28">双 feeder + Indexer 供料</tspan></text></g>
  <path d="M958 334 C958 500 864 492 790 492" fill="none" stroke="#2f7295" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="600" y="616" text-anchor="middle" font-size="19" font-weight="600" fill="#2c7624"><tspan x="600" dy="0">条件不足时不放行 FUEL</tspan></text>

</svg>