<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">动态发射解算器</title>
  <desc id="description">求解未来发射位置，而不是只瞄准当前位置</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52ad32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18321a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f5f8f3"/>
  <rect x="54" y="46" width="1092" height="628" rx="28" fill="#ffffff" stroke="#bfd4b7" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="112" text-anchor="start" font-size="34" font-weight="700" fill="#102018"><tspan x="92" dy="0">动态发射解算器</tspan></text>
  <text x="92" y="150" text-anchor="start" font-size="18" font-weight="500" fill="#58665e"><tspan x="92" dy="0">求解未来发射位置，而不是只瞄准当前位置</tspan></text>
  <path d="M92 178 H1108" stroke="#bfd4b7" stroke-width="2"/>
  <g><rect x="92" y="278" width="228.5" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="206.25" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="206.25" dy="0">机器人位姿</tspan><tspan x="206.25" dy="28">底盘速度</tspan></text></g><path d="M 326.5 342 L 348.5 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="354.5" y="278" width="228.5" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="468.75" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="468.75" dy="0">飞行时间</tspan><tspan x="468.75" dy="28">查表插值</tspan></text></g><path d="M 589 342 L 611 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="617" y="278" width="228.5" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="731.25" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="731.25" dy="0">未来发射点</tspan><tspan x="731.25" dy="28">位置预测</tspan></text></g><path d="M 851.5 342 L 873.5 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="879.5" y="278" width="228.5" height="128" rx="18" fill="#e7f3e2" stroke="#52ad32" stroke-width="2"/><text x="993.75" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="993.75" dy="0">双炮塔解</tspan><tspan x="993.75" dy="28">角度 · Hood · 转速</tspan></text></g><rect x="92" y="476" width="1016" height="118" rx="18" fill="#e7f3e2"/><text x="600" y="523" text-anchor="middle" font-size="20" font-weight="600" fill="#2c7624"><tspan x="600" dy="0">机器人移动和旋转产生的发射点速度都会进入补偿</tspan><tspan x="600" dy="29">两套炮塔持续独立更新</tspan></text>
</svg>