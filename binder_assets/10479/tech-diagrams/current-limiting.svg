<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">动态底盘电流限制</title>
  <desc id="description">按电压与比赛阶段为双炮塔保留供电余量</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52ad32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18321a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f5f8f3"/>
  <rect x="54" y="46" width="1092" height="628" rx="28" fill="#ffffff" stroke="#bfd4b7" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="112" text-anchor="start" font-size="34" font-weight="700" fill="#102018"><tspan x="92" dy="0">动态底盘电流限制</tspan></text>
  <text x="92" y="150" text-anchor="start" font-size="18" font-weight="500" fill="#58665e"><tspan x="92" dy="0">按电压与比赛阶段为双炮塔保留供电余量</tspan></text>
  <path d="M92 178 H1108" stroke="#bfd4b7" stroke-width="2"/>
  
  <g><rect x="92" y="222" width="310" height="122" rx="18" fill="#e7f3e2" stroke="#52ad32" stroke-width="2"/><text x="247" y="273" text-anchor="middle" font-size="23" font-weight="600" fill="#102018"><tspan x="247" dy="0">自动阶段 / &gt; 10.5 V</tspan><tspan x="247" dy="28">80 A</tspan></text></g>
  <g><rect x="445" y="222" width="310" height="122" rx="18" fill="#fff7dd" stroke="#efad00" stroke-width="2"/><text x="600" y="273" text-anchor="middle" font-size="23" font-weight="600" fill="#102018"><tspan x="600" dy="0">手动 · 7.5-10.5 V</tspan><tspan x="600" dy="28">40 A</tspan></text></g>
  <g><rect x="798" y="222" width="310" height="122" rx="18" fill="#fbe9e5" stroke="#c95a4a" stroke-width="2"/><text x="953" y="273" text-anchor="middle" font-size="23" font-weight="600" fill="#102018"><tspan x="953" dy="0">手动 · &lt; 7.5 V</tspan><tspan x="953" dy="28">20 A</tspan></text></g>
  <path d="M106 522 H310 L430 478 L562 432 L700 386 L1094 386" fill="none" stroke="#52ad32" stroke-width="7" stroke-linecap="round"/>
  <text x="92" y="420" text-anchor="start" font-size="22" font-weight="700" fill="#102018"><tspan x="92" dy="0">电压恢复后平滑回升</tspan></text>
  <text x="1108" y="424" text-anchor="end" font-size="22" font-weight="700" fill="#2c7624"><tspan x="1108" dy="0">+1 A / 20 ms</tspan></text>
  <text x="600" y="608" text-anchor="middle" font-size="19" font-weight="600" fill="#58665e"><tspan x="600" dy="0">避免瞬时恢复造成新的电压跌落</tspan></text>

</svg>