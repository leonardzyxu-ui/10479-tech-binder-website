  <path d="M 182 446 L 182 500" fill="none" stroke="#2c7624" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 387 446 L 387 500" fill="none" stroke="#2c7624" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 592 446 L 592 500" fill="none" stroke="#2c7624" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 797 446 L 797 500" fill="none" stroke="#2c7624" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 1002 446 L 1002 500" fill="none" stroke="#2c7624" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
