<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">20 轮耦合求解</title>
  <desc id="description">距离影响飞行时间，位移又改变距离</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#52ad32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18321a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f5f8f3"/>
  <rect x="54" y="46" width="1092" height="628" rx="28" fill="#ffffff" stroke="#bfd4b7" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="112" text-anchor="start" font-size="34" font-weight="700" fill="#102018"><tspan x="92" dy="0">20 轮耦合求解</tspan></text>
  <text x="92" y="150" text-anchor="start" font-size="18" font-weight="500" fill="#58665e"><tspan x="92" dy="0">距离影响飞行时间，位移又改变距离</tspan></text>
  <path d="M92 178 H1108" stroke="#bfd4b7" stroke-width="2"/>
  <g><rect x="92" y="278" width="176" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="180" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="180" dy="0">当前距离</tspan><tspan x="180" dy="28">初始估计</tspan></text></g><path d="M 274 342 L 296 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="302" y="278" width="176" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="390" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="390" dy="0">估算</tspan><tspan x="390" dy="28">飞行时间</tspan></text></g><path d="M 484 342 L 506 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="512" y="278" width="176" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="600" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="600" dy="0">预测</tspan><tspan x="600" dy="28">机器人位移</tspan></text></g><path d="M 694 342 L 716 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="722" y="278" width="176" height="128" rx="18" fill="#ffffff" stroke="#bfd4b7" stroke-width="2"/><text x="810" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="810" dy="0">重算</tspan><tspan x="810" dy="28">目标距离</tspan></text></g><path d="M 904 342 L 926 342" fill="none" stroke="#52ad32" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="932" y="278" width="176" height="128" rx="18" fill="#e7f3e2" stroke="#52ad32" stroke-width="2"/><text x="1020" y="332" text-anchor="middle" font-size="21" font-weight="600" fill="#102018"><tspan x="1020" dy="0">重复 20 轮</tspan><tspan x="1020" dy="28">输出最终解</tspan></text></g><rect x="92" y="476" width="1016" height="118" rx="18" fill="#e7f3e2"/><text x="600" y="523" text-anchor="middle" font-size="20" font-weight="600" fill="#2c7624"><tspan x="600" dy="0">每轮都更新距离、飞行时间与瞄准结果</tspan><tspan x="600" dy="29">使用最后一轮形成动态射击参数</tspan></text>
</svg>